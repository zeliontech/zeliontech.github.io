<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Self-hosted fonts: preload the two faces used above the fold (Inter
         700 for the display headline, Inter 400 for body copy) so the first
         paint needs no font swap. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-700-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-400-latin.woff2" />

    <!-- The hero scene is rendered by React, so without this the browser
         cannot discover it until the bundle has executed. It is the largest
         paint on every viewport. Browsers without AVIF skip a typed preload
         and pick the WebP or JPEG from the <picture> as usual. Keep the
         srcset and sizes identical to src/components/zev/hero-image.js. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/zev/zev-scene-800.avif 800w, /zev/zev-scene-1200.avif 1200w, /zev/zev-scene-1600.avif 1600w"
      imagesizes="(min-width: 1024px) 760px, 100vw"
    />

    <!-- Primary Meta Tags -->
    <title>ZelionTech Energy Network</title>
    <meta name="title" content="ZelionTech Energy Network" />
    <meta name="description" content="ZelionTech is developing ZEV — the intelligence layer for renewable energy, connecting physical energy infrastructure with secure data validation, AI and blockchain." />
    <meta name="author" content="ZelionTech" />
    <meta name="keywords" content="energy, blockchain, renewable energy, verification, infrastructure, BNB Chain, Web3" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zeliontech.com/" />
    <meta property="og:title" content="ZelionTech Energy Network" />
    <meta property="og:description" content="ZelionTech is developing ZEV — the intelligence layer for renewable energy, connecting physical energy infrastructure with secure data validation, AI and blockchain." />
    <meta property="og:image" content="https://zeliontech.com/preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The ZEV device on a concrete pad in front of a solar array, with wind turbines on the hills behind" />
    <meta property="og:site_name" content="ZelionTech" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://zeliontech.com/" />
    <meta name="twitter:title" content="ZelionTech Energy Network" />
    <meta name="twitter:description" content="ZelionTech is developing ZEV — the intelligence layer for renewable energy, connecting physical energy infrastructure with secure data validation, AI and blockchain." />
    <meta name="twitter:image" content="https://zeliontech.com/preview.jpg" />
    <meta name="twitter:image:alt" content="The ZEV device on a concrete pad in front of a solar array, with wind turbines on the hills behind" />
    <meta name="twitter:site" content="@zelion_tech" />
    <meta name="twitter:creator" content="@zelion_tech" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
