<svg viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZEV device">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2F37"/>
      <stop offset="1" stop-color="#1E2127"/>
    </linearGradient>
  </defs>

  <!-- DIN rail behind -->
  <rect x="0" y="150" width="260" height="44" rx="4" fill="#171A1F"/>
  <rect x="0" y="154" width="260" height="3" fill="#2A2E36"/>
  <rect x="0" y="187" width="260" height="3" fill="#2A2E36"/>

  <!-- Enclosure -->
  <rect x="22" y="12" width="216" height="316" rx="10" fill="url(#body)" stroke="#33373F" stroke-width="1.5"/>
  <!-- Front panel -->
  <rect x="34" y="24" width="192" height="292" rx="6" fill="#1B1E24"/>
  <!-- Cyan seam frame -->
  <rect x="34" y="24" width="192" height="292" rx="6" fill="none" stroke="#2FC5F2" stroke-width="1.4" opacity="0.85" filter="url(#glow)"/>

  <!-- Antenna -->
  <rect x="196" y="0" width="5" height="16" rx="2.5" fill="#33373F"/>
  <circle cx="198.5" cy="2" r="3.4" fill="#2FC5F2" filter="url(#glow)"/>

  <!-- OLED window -->
  <rect x="56" y="46" width="148" height="64" rx="4" fill="#0A0C10"/>
  <rect x="62" y="52" width="136" height="52" rx="2" fill="#05161C"/>
  <rect x="72" y="66" width="92" height="4" rx="2" fill="#2FC5F2" filter="url(#glow)"/>
  <rect x="72" y="80" width="64" height="3" rx="1.5" fill="#2FC5F2" opacity="0.55"/>
  <rect x="72" y="90" width="78" height="3" rx="1.5" fill="#2FC5F2" opacity="0.3"/>

  <!-- Status LEDs -->
  <circle cx="70" cy="136" r="5" fill="#2FC5F2" filter="url(#glow)"/>
  <circle cx="94" cy="136" r="5" fill="#2FC5F2" opacity="0.65"/>
  <circle cx="118" cy="136" r="5" fill="#10B981" filter="url(#glow)"/>
  <circle cx="142" cy="136" r="5" fill="#3A3F48"/>

  <!-- Ventilation slats -->
  <g fill="#101318">
    <rect x="56" y="162" width="148" height="7" rx="3.5"/>
    <rect x="56" y="177" width="148" height="7" rx="3.5"/>
    <rect x="56" y="192" width="148" height="7" rx="3.5"/>
    <rect x="56" y="207" width="148" height="7" rx="3.5"/>
    <rect x="56" y="222" width="148" height="7" rx="3.5"/>
    <rect x="56" y="237" width="148" height="7" rx="3.5"/>
  </g>

  <!-- Terminal block -->
  <rect x="52" y="266" width="156" height="34" rx="4" fill="#14171C" stroke="#2A2E36" stroke-width="1"/>
  <g fill="#4A505B" stroke="#5A6170" stroke-width="1">
    <circle cx="76" cy="283" r="6"/>
    <circle cx="103" cy="283" r="6"/>
    <circle cx="130" cy="283" r="6"/>
    <circle cx="157" cy="283" r="6"/>
    <circle cx="184" cy="283" r="6"/>
  </g>
  <g stroke="#2A2E36" stroke-width="1.6" stroke-linecap="round">
    <line x1="72" y1="279" x2="80" y2="287"/>
    <line x1="99" y1="279" x2="107" y2="287"/>
    <line x1="126" y1="279" x2="134" y2="287"/>
    <line x1="153" y1="279" x2="161" y2="287"/>
    <line x1="180" y1="279" x2="188" y2="287"/>
  </g>
</svg>
